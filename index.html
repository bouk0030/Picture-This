<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Picture This!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <div class="title">
      <h1>Picture This!</h1>
      <h4>My Really Cool Blog Post</h4>
    </div>

<!--I put the largest screen sizes first because the browser uses
the first source that matches. I use square images from 960px
and landscape images below 960px. The 1x, 2x and 3x versions
provide different resolutions for different screen densities.

 I created the image files in Photoshop-->


    <picture>
  <source
    srcset="images/museum-square-800.png 1x,
            images/museum-square-1600.png 2x,
            images/museum-square-2400.png 3x"
    media="(min-width: 1600px)">
      <source
    srcset="images/museum-square-640.png 1x,
            images/museum-square-1280.png 2x,
            images/museum-square-1920.png 3x"
    media="(min-width: 1280px)">
      <source
    srcset="images/museum-square-480.png 1x,
            images/museum-square-960.png 2x,
            images/museum-square-1440.png 3x"
    media="(min-width: 960px)">
      <source
    srcset="images/museum-landscape-720.png 1x,
            images/museum-landscape-1440.png 2x,
            images/museum-landscape-2160.png 3x"
    media="(min-width: 720px)">
      <source
    srcset="images/museum-landscape-480.png 1x,
            images/museum-landscape-960.png 2x,
            images/museum-landscape-1440.png 3x"
    media="(min-width: 480px)">
      <source
    srcset="images/museum-landscape-320.png 1x,
            images/museum-landscape-640.png 2x,
            images/museum-landscape-960.png 3x"
    media="(width: 480px)">
  <img src="images/museum.png" alt="Paintings and benches inside a museum gallery">
    
</picture>

  </header>
</body>

</html>
